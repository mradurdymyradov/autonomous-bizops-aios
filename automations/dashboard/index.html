   asked for dark on 2026-08-05. Dark was never the problem — NEON ON BLACK was.
   So:

   1  Every surface shares ONE hue and varies only in lightness. A ramp whose hue
      drifts between steps is what reads as muddy and cheap. Nothing here is
      chroma 0 either — flat neutral grey is the other tell.
   2  The canvas is #0B0C0F, not #000. Pure black under white text maxes contrast
      at 21:1, and the eye's own chromatic aberration then makes edges halate and
      smear on scroll. #000 is reserved for the modal scrim, so there is always
      one step darker available.
   3  ONE accent (#6371E0) at 4.63:1 on canvas — deliberately too dim to be text.
      It means "interactive": focus ring, active nav, links, highlighted series.
      Never decoration.
   4  ONE extra semantic colour with a single meaning: --live (#9BCF3F) = "this
      needs you". Everything else is grey. Colour here is information.
   5  No shadows on inline surfaces — they read as smudges on dark. Elevation is
      a hairline plus one step up the ramp. Shadows appear only on the floating
      layer (drawer, palette), where they are physically right.
   6  Body sits at 15px; only uppercase micro-labels and badges go to 11px, and
      nothing goes below that. The first version of this page was rejected as
      unreadable and that complaint is load-bearing.
   7  EVERY ink clears 4.5:1 on EVERY surface it can land on. The dimmest tier
      started at 3.0:1 as a "watermark", then drew table headers, hero labels
      and ages — so it was lifted rather than policed. A ramp you have to
      remember the rules for is a ramp that will be broken by the next edit.

   Contrast, measured (sRGB, WCAG 2.x) against --panel #15171C / --elevated #21252C:
     --ink-1 #F2F4F7  16.3 / 14.0     --ink-3 #9BA3B1   7.1 / 6.1
     --ink-2 #C9CFD9  11.5 /  9.8     --ink-4 #858E9C   5.4 / 4.7
     --accent-hi #8C97F0 6.7 / 5.7    --live  #9BCF3F   9.7 / 8.3
   --accent #6371E0 sits at 4.24 on panel on purpose: it is a state, never text.
   ============================================================================ */

:root{
  --canvas:#0B0C0F; --page:#101116; --panel:#15171C; --raised:#1A1D23;
  --elevated:#21252C; --scrim:rgba(0,0,0,.68);
  --hair:rgba(255,255,255,.07); --hair2:rgba(255,255,255,.11); --hair3:rgba(255,255,255,.17);
  --ink-1:#F2F4F7; --ink-2:#C9CFD9; --ink-3:#9BA3B1; --ink-4:#858E9C;
  --accent:#6371E0; --accent-hi:#8C97F0; --accent-dim:rgba(99,113,224,.16);
  /* A filled button carries white text, so its fill has to be DARKER than the
     accent used for hairlines and states: #6371E0 under white is 4.23:1. */
  --accent-solid:#5A67D4; --accent-solid-hi:#4F5DCB;
  --live:#9BCF3F; --live-dim:rgba(155,207,63,.14);
  --pos:#4CC38A; --warn:#E0A03A; --dang:#E5484D; --dang-hi:#F0666B;
  --dang-dim:rgba(229,72,77,.14); --warn-dim:rgba(224,160,58,.14);

  --f-ui:'Golos Text',"Segoe UI",ui-sans-serif,system-ui,sans-serif;
  --f-num:"Segoe UI",ui-sans-serif,system-ui,-apple-system,sans-serif;
  --f-mono:ui-monospace,Consolas,"SF Mono",Menlo,monospace;

  --t-h1:21px; --t-h2:14px; --t-body:15px; --t-sm:13.5px; --t-xs:12.5px; --t-label:11px;
  --r-sm:6px; --r:10px; --r-lg:14px;
  --rail:244px; --pad:22px; --gap:14px; --row:46px;
  --d1:120ms; --d2:180ms; --d3:240ms; --ease:cubic-bezier(.23,1,.32,1);
}
[data-density="compact"]{--t-body:14px;--t-sm:13px;--t-xs:12px;--row:36px;--pad:18px;--gap:12px}

*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--canvas);color:var(--ink-2);
  font:400 var(--t-body)/1.5 var(--f-ui);letter-spacing:-.005em;
  -webkit-font-smoothing:antialiased;overscroll-behavior:none;
}
h1,h2,h3,p,ul,ol,dl,figure{margin:0}
ul,ol{padding:0;list-style:none}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input{font:inherit;color:inherit}
svg{display:block}
:where(a,button,input,[tabindex]):focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:var(--r-sm)}
::selection{background:var(--accent-dim);color:var(--ink-1)}
.skip{position:fixed;left:-999px;top:0;z-index:99;background:var(--elevated);padding:10px 16px;border-radius:var(--r)}
.skip:focus{left:8px;top:8px}

/* Golos has no `tnum` and its digits are proportional (0=620, 1=485 units), so
   columns of figures do not line up in it. Every number is set in the system UI
   face, whose digits ARE tabular by default; mono is the data register. */
.num,.kpi-v,td.n,th.n,.stat-v,.hero-v,.mono{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-feature-settings:'tnum' 1}
.mono{font-family:var(--f-mono);letter-spacing:-.02em}

*{scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.14) transparent}
*::-webkit-scrollbar{width:10px;height:10px}
*::-webkit-scrollbar-thumb{background:rgba(255,255,255,.13);border-radius:99px;border:3px solid transparent;background-clip:content-box}
*::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.24);background-clip:content-box}

/* ============================================================ shell ======= */
#app{height:100dvh;display:grid;grid-template-columns:var(--rail) 1fr;background:var(--canvas)}
html[data-rail="collapsed"]{--rail:64px}

#rail{display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--hair);background:var(--canvas)}
.rail-top{display:flex;align-items:center;gap:8px;padding:14px 12px 10px 14px}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1;border-radius:var(--r-sm)}
.brand-mark{display:flex;align-items:flex-end;gap:2.5px;height:18px;flex:none}
.brand-mark i{width:4px;border-radius:1.5px;display:block}
.brand-mark i:nth-child(1){height:9px;background:var(--accent)}
.brand-mark i:nth-child(2){height:14px;background:var(--ink-3)}
.brand-mark i:nth-child(3){height:18px;background:var(--live)}
.brand-txt{display:flex;flex-direction:column;line-height:1.15;min-width:0}
.brand-txt b{font-size:13.5px;font-weight:700;color:var(--ink-1);letter-spacing:.04em}
.brand-txt em{font-style:normal;font-size:11px;color:var(--ink-4);font-family:var(--f-mono)}

.icon-btn{display:grid;place-items:center;width:28px;height:28px;flex:none;border-radius:var(--r-sm);
  color:var(--ink-3);transition:background var(--d1) ease,color var(--d1) ease}
.icon-btn:hover{background:var(--raised);color:var(--ink-1)}

.railsearch{display:flex;align-items:center;gap:8px;margin:2px 12px 12px;padding:0 9px;height:32px;
  border:1px solid var(--hair);border-radius:var(--r-sm);color:var(--ink-4);background:var(--page);
  font-size:var(--t-sm);transition:border-color var(--d1) ease,color var(--d1) ease}
.railsearch:hover{border-color:var(--hair3);color:var(--ink-3)}
.railsearch span{flex:1;text-align:left}
kbd{font:500 11px/1 var(--f-mono);color:var(--ink-4);background:var(--raised);
  border:1px solid var(--hair);border-radius:4px;padding:3px 4px;flex:none}

#nav{flex:1;min-height:0;overflow-y:auto;padding:0 8px}
.nav-sec{font:600 var(--t-label)/1 var(--f-ui);letter-spacing:.09em;text-transform:uppercase;color:var(--ink-4);padding:14px 8px 7px}
.nav-a{position:relative;display:flex;align-items:center;gap:10px;height:34px;padding:0 9px;border-radius:var(--r-sm);
  color:var(--ink-3);font-size:var(--t-sm);font-weight:500;transition:background var(--d1) ease,color var(--d1) ease}
.nav-a:hover{background:var(--raised);color:var(--ink-1)}
.nav-a[aria-current]{background:rgba(255,255,255,.055);color:var(--ink-1)}
.nav-a[aria-current]::before{content:"";position:absolute;left:-8px;top:8px;bottom:8px;width:2px;border-radius:0 2px 2px 0;background:var(--accent)}
.nav-a svg{flex:none;opacity:.85}
.nav-a .lbl{flex:1;white-space:nowrap;overflow:hidden}
.nav-a .cnt{font:500 11px/1 var(--f-num);font-variant-numeric:tabular-nums;color:var(--ink-4);
  background:var(--raised);border-radius:99px;padding:3px 6px;flex:none}
.nav-a[data-hot="1"] .cnt{color:var(--live);background:var(--live-dim)}

.rail-foot{border-top:1px solid var(--hair);padding:10px 14px}
#freshness{display:flex;flex-direction:column;gap:5px;font:400 var(--t-label)/1.35 var(--f-mono);color:var(--ink-4)}
#freshness .fr{display:flex;align-items:center;gap:6px;white-space:nowrap;overflow:hidden}
#freshness .dot{width:5px;height:5px;border-radius:99px;flex:none;background:var(--pos)}
#freshness .dot.warn{background:var(--warn)}
#freshness .dot.bad{background:var(--dang)}

html[data-rail="collapsed"] .brand-txt,
html[data-rail="collapsed"] .railsearch span,
html[data-rail="collapsed"] .railsearch kbd,
html[data-rail="collapsed"] .nav-a .lbl,
html[data-rail="collapsed"] .nav-sec,
html[data-rail="collapsed"] #rail-toggle,
html[data-rail="collapsed"] .rail-foot{display:none}
html[data-rail="collapsed"] .nav-a{justify-content:center;padding:0}
html[data-rail="collapsed"] .nav-a .cnt{position:absolute;top:0;right:0;padding:1px 4px;font-size:9.5px}
html[data-rail="collapsed"] .railsearch{justify-content:center;padding:0}
html[data-rail="collapsed"] .rail-top{padding-left:12px;justify-content:center}

/* ============================================================ topbar ===== */
/* minmax(0,1fr), not 1fr: an `auto`/`1fr` track floors at the MIN-CONTENT of
   its widest descendant, so one nowrap table cell inflates the whole column
   past the viewport and the page scrolls sideways. Every track on the path
   from #app down to a table therefore has to carry an explicit zero floor. */
#main{display:grid;grid-template-rows:auto 1fr;grid-template-columns:minmax(0,1fr);
  min-width:0;min-height:0;background:var(--page)}
#topbar{display:flex;align-items:center;gap:14px;padding:0 var(--pad);height:56px;min-width:0;
  border-bottom:1px solid var(--hair);background:var(--page)}
.crumb{min-width:0;flex:0 1 auto;overflow:hidden}
#page-title{font:600 var(--t-h1)/1.2 var(--f-ui);letter-spacing:-.02em;color:var(--ink-1)}
#page-sub{font:400 var(--t-xs)/1.3 var(--f-mono);color:var(--ink-4);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:10px;min-width:0;
  flex:0 1 auto;justify-content:flex-end}
/* The tab strip is the one thing in the bar allowed to scroll rather than
   wrap -- a wrapped strip changes the header height between sections, and a
   header that jumps as you navigate reads as a bug. */
#tabs{display:flex;gap:2px;padding:3px;background:var(--canvas);border:1px solid var(--hair);
  border-radius:var(--r-sm);overflow-x:auto;scrollbar-width:none;min-width:0;flex:0 1 auto}
#tabs::-webkit-scrollbar{display:none}
#tabs:empty{display:none}
.tab{display:flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:4px;
  font-size:var(--t-xs);font-weight:500;color:var(--ink-3);white-space:nowrap;
  transition:background var(--d1) ease,color var(--d1) ease}
.tab:hover{color:var(--ink-1)}
.tab[aria-selected="true"]{background:var(--raised);color:var(--ink-1)}
.tab b{font:500 11px/1 var(--f-num);font-variant-numeric:tabular-nums;color:var(--ink-4)}
.tab[aria-selected="true"] b{color:var(--accent-hi)}
.only-narrow{display:none}

#view{overflow-y:auto;overflow-x:hidden;padding:var(--pad);min-width:0}
.stack{display:flex;flex-direction:column;gap:var(--gap);min-width:0}

/* ============================================================ panels ===== */
.panel{background:var(--panel);border:1px solid var(--hair);border-radius:var(--r-lg);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.045);min-width:0;overflow:hidden}
.panel-h{display:flex;align-items:center;gap:10px;padding:13px 16px;border-bottom:1px solid var(--hair);flex-wrap:wrap}
.panel-h h2{font:600 var(--t-h2)/1.3 var(--f-ui);color:var(--ink-1);letter-spacing:-.01em}
.panel-h .sub{font:400 var(--t-xs)/1.3 var(--f-mono);color:var(--ink-4)}
.panel-h .right{margin-left:auto;display:flex;align-items:center;gap:8px}
.panel-b{padding:16px}
.panel-b.flush{padding:0}
.grid{display:grid;gap:var(--gap)}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.split{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:var(--gap);align-items:start}

.lab{font:600 var(--t-label)/1 var(--f-ui);letter-spacing:.09em;text-transform:uppercase;color:var(--ink-4)}
.muted{color:var(--ink-3)}
.dim{color:var(--ink-4)}
.tiny{font-size:var(--t-xs)}
.note{font-size:var(--t-sm);color:var(--ink-3);line-height:1.55}
.rowflex{display:flex;align-items:center;gap:8px;flex-wrap:wrap}

/* ============================================================ hero ======= */
.hero{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--hair);
  border:1px solid var(--hair);border-radius:var(--r-lg);overflow:hidden}
.hero-c{background:var(--panel);padding:18px 20px 17px;display:flex;flex-direction:column;
  transition:background var(--d1) ease}
a.hero-c:hover{background:var(--raised)}
.hero-c .lab{margin-bottom:11px}
.hero-v{font:600 clamp(34px,4.4vw,48px)/1 var(--f-num);color:var(--ink-1);letter-spacing:-.035em;
  display:flex;align-items:baseline;gap:8px}
.hero-v .unit{font-size:.4em;font-weight:500;color:var(--ink-3);letter-spacing:0}
.hero-c .sub{font-size:var(--t-xs);color:var(--ink-3);margin-top:8px;line-height:1.5}
.hero-c.is-live .hero-v{color:var(--live)}
.hero-c.is-dang .hero-v{color:var(--dang)}
.hero-delta{font:500 11px/1 var(--f-num);font-variant-numeric:tabular-nums;color:var(--live);
  background:var(--live-dim);border-radius:99px;padding:4px 8px;align-self:flex-start;margin-top:9px}
.hero-delta.zero{color:var(--ink-4);background:var(--raised)}

/* ============================================================ insights === */
.ins{display:flex;gap:12px;padding:13px 15px;border-radius:var(--r);background:var(--panel);
  border:1px solid var(--hair);border-left:2px solid var(--ink-4)}
.ins[data-sev="act"]{border-left-color:var(--live)}
.ins[data-sev="watch"]{border-left-color:var(--warn)}
.ins-b{min-width:0;flex:1;display:flex;flex-direction:column;gap:5px}
.ins h3{font:600 var(--t-body)/1.35 var(--f-ui);color:var(--ink-1);letter-spacing:-.01em}
.ins .ev{font:400 var(--t-xs)/1.55 var(--f-mono);color:var(--ink-3)}
.ins .rec{font-size:var(--t-sm);color:var(--ink-2);line-height:1.5}
.ins .go{align-self:flex-start;font-size:var(--t-xs);font-weight:600;color:var(--accent-hi);margin-top:1px}
.ins .go:hover{text-decoration:underline}

/* ============================================================ queue ====== */
.qhead{display:flex;align-items:center;gap:8px;padding:16px 4px 8px}
.qhead .lab{color:var(--ink-3)}
.qhead .n{font:500 11px/1 var(--f-num);font-variant-numeric:tabular-nums;color:var(--ink-4);
  background:var(--raised);border-radius:99px;padding:3px 7px}
.qhead .why{font-size:var(--t-xs);color:var(--ink-4);margin-left:auto;text-align:right}
.qlist{display:flex;flex-direction:column;border:1px solid var(--hair);border-radius:var(--r);
  overflow:hidden;background:var(--panel)}
.q{display:grid;grid-template-columns:3px minmax(0,1fr) auto;border-bottom:1px solid var(--hair);
  transition:background var(--d1) ease;cursor:pointer}
.q:last-child{border-bottom:0}
.q:hover{background:var(--raised)}
.q .flag{background:transparent}
.q[data-sev="act"] .flag{background:var(--live)}
.q[data-sev="watch"] .flag{background:var(--warn)}
.q-main{min-width:0;padding:11px 14px;display:flex;flex-direction:column;gap:3px}
.q-t{display:flex;align-items:baseline;gap:8px;min-width:0}
.q-t b{font:500 var(--t-body)/1.35 var(--f-ui);color:var(--ink-1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.q-t .meta{font:400 var(--t-xs)/1 var(--f-mono);color:var(--ink-4);white-space:nowrap;flex:none}
.q-w{font-size:var(--t-sm);color:var(--ink-3);line-height:1.45;display:-webkit-box;
  -webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.q-a{font-size:var(--t-sm);color:var(--ink-2);line-height:1.45;display:-webkit-box;
  -webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.q-a::before{content:"→ ";color:var(--ink-4)}
.q-side{display:flex;align-items:center;gap:8px;padding:0 12px 0 8px;flex:none}
.q-age{font:500 var(--t-xs)/1 var(--f-num);font-variant-numeric:tabular-nums;color:var(--ink-4);white-space:nowrap}
.q-age.old{color:var(--warn)}
.q-btn{display:grid;place-items:center;height:28px;padding:0 10px;border-radius:var(--r-sm);
  border:1px solid var(--hair2);font-size:var(--t-xs);font-weight:600;color:var(--ink-3);opacity:0;
  transition:opacity var(--d1) ease,background var(--d1) ease,color var(--d1) ease,border-color var(--d1) ease}
.q:hover .q-btn,.q-btn:focus-visible{opacity:1}
.q-btn:hover{background:var(--accent);border-color:var(--accent);color:#fff}
@media (hover:none){.q-btn{opacity:1}}

/* ============================================================ stats ====== */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));gap:1px;background:var(--hair)}
.stat{background:var(--panel);padding:13px 15px;display:flex;flex-direction:column;gap:6px;min-width:0}
.stat .lab{color:var(--ink-4)}
.stat-v{font:600 22px/1 var(--f-num);color:var(--ink-1);letter-spacing:-.02em}
.stat-v small{font-size:12px;font-weight:500;color:var(--ink-3);letter-spacing:0;margin-left:3px}
.stat .sub{font-size:var(--t-xs);color:var(--ink-4);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat.acc .stat-v{color:var(--live)}
.stat.bad .stat-v{color:var(--dang)}
.stat.null .stat-v{color:var(--ink-4)}

/* ============================================================ badges ===== */
.badge{display:inline-flex;align-items:center;gap:5px;height:20px;padding:0 7px;border-radius:5px;
  font:600 var(--t-label)/1 var(--f-ui);letter-spacing:.05em;text-transform:uppercase;
  background:var(--raised);color:var(--ink-3);border:1px solid var(--hair);white-space:nowrap;flex:none}
.badge.live{color:var(--live);background:var(--live-dim);border-color:transparent}
.badge.warn{color:var(--warn);background:var(--warn-dim);border-color:transparent}
.badge.bad{color:var(--dang-hi);background:var(--dang-dim);border-color:transparent}
.badge.acc{color:var(--accent-hi);background:var(--accent-dim);border-color:transparent}
.chip{display:inline-flex;align-items:center;gap:6px;height:27px;padding:0 10px;border-radius:99px;
  border:1px solid var(--hair2);font-size:var(--t-xs);color:var(--ink-3);background:var(--panel);
  transition:border-color var(--d1) ease,color var(--d1) ease,background var(--d1) ease}
.chip:hover{border-color:var(--hair3);color:var(--ink-1)}
.chip[aria-pressed="true"]{background:var(--accent-dim);border-color:transparent;color:var(--accent-hi)}
.chip b{font:500 11px/1 var(--f-num);font-variant-numeric:tabular-nums;opacity:.8}
.filters{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.srch{display:flex;align-items:center;gap:8px;height:31px;padding:0 10px;border-radius:var(--r-sm);
  border:1px solid var(--hair2);background:var(--canvas);color:var(--ink-4);min-width:190px;flex:1;max-width:300px}
.srch input{flex:1;min-width:0;border:0;background:none;outline:0;font-size:var(--t-sm);color:var(--ink-1)}
.srch input::placeholder{color:var(--ink-4)}

/* ============================================================ tables ===== */
/* The table scrolls in BOTH axes inside its panel, rather than riding the page
   scroll. `overflow-x:auto` alone would already make this a scroll container
   (overflow-y:visible computes to auto next to it), which silently kills a
   sticky thead relative to #view -- so make it deliberate: the panel header
   stays put, the column headers stick to the top of their own scroller. */
.tw{overflow:auto;overscroll-behavior:contain;min-width:0;max-width:100%;
  max-height:calc(100dvh - 214px)}
table{width:100%;border-collapse:separate;border-spacing:0;font-size:var(--t-sm)}
thead th{position:sticky;top:0;z-index:2;background:var(--panel);text-align:left;white-space:nowrap;
  font:600 var(--t-label)/1 var(--f-ui);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-4);
  padding:11px 12px;box-shadow:inset 0 -1px 0 var(--hair);cursor:pointer;user-select:none}
thead th.no-sort{cursor:default}
thead th:hover:not(.no-sort){color:var(--ink-2)}
thead th .ar{opacity:0;margin-left:4px;font-size:11px;line-height:1}
thead th[aria-sort]{color:var(--ink-1)}
thead th[aria-sort] .ar{opacity:1;color:var(--accent-hi)}
tbody tr{transition:background var(--d1) ease;cursor:pointer}
tbody tr:hover{background:var(--raised)}
tbody tr.cursor-row{box-shadow:inset 2px 0 0 var(--accent)}
tbody td{padding:0 12px;height:var(--row);border-bottom:1px solid var(--hair);color:var(--ink-2);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:260px}
tbody tr:last-child td{border-bottom:0}
td.n,th.n{text-align:right}
td.strong{color:var(--ink-1);font-weight:500}
.tw .empty{padding:34px 16px;text-align:center;color:var(--ink-4);font-size:var(--t-sm)}

/* ============================================================ bars ======= */
.rows{display:flex;flex-direction:column}
.brow{display:grid;grid-template-columns:minmax(82px,25%) 1fr auto;align-items:center;gap:12px;padding:7px 0}
.brow .k{font-size:var(--t-sm);color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brow .track{height:8px;border-radius:3px;background:rgba(255,255,255,.05);overflow:hidden}
.brow .fill{height:100%;border-radius:3px;background:var(--ink-3)}
.brow.hi .fill{background:var(--accent)}
.brow.on .fill{background:var(--live)}
.brow .v{font:500 var(--t-sm)/1 var(--f-num);font-variant-numeric:tabular-nums;color:var(--ink-1);min-width:34px;text-align:right}
.brow .v em{font-style:normal;font-size:11.5px;color:var(--ink-4);margin-left:5px}

/* ============================================================ stage rail = */
.srail{display:flex;align-items:center;gap:3px;flex:none}
.srail i{width:14px;height:4px;border-radius:2px;background:rgba(255,255,255,.09);display:block;flex:none}
.srail i.done{background:var(--ink-3)}
.srail i.at{background:var(--live);width:20px}
.srail.sm i{width:9px;height:3px}
.srail.sm i.at{width:14px}

/* ============================================================ pipeline === */
.pcard{border-bottom:1px solid var(--hair);transition:background var(--d1) ease;cursor:pointer}
.pcard:last-child{border-bottom:0}
.pcard:hover{background:var(--raised)}
.pc-top{display:flex;align-items:center;gap:10px;padding:13px 16px 5px;min-width:0;flex-wrap:wrap}
.pc-rank{font:600 var(--t-xs)/1 var(--f-num);color:var(--ink-4);width:16px;flex:none}
.pc-name{font:600 var(--t-body)/1.3 var(--f-ui);color:var(--ink-1);letter-spacing:-.01em;flex:none}
.pc-niche{font-size:var(--t-xs);color:var(--ink-4);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.pc-right{margin-left:auto;display:flex;align-items:center;gap:10px;flex:0 1 auto;flex-wrap:wrap;justify-content:flex-end}
.pc-body{padding:0 16px 13px 42px;display:flex;flex-direction:column;gap:6px}
.pc-blk{font-size:var(--t-sm);color:var(--ink-2);line-height:1.5;display:-webkit-box;
  -webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pc-blk::before{content:"✕";color:var(--dang);margin-right:7px;font-size:10px}
.pc-next{font-size:var(--t-sm);color:var(--ink-3);line-height:1.5;display:-webkit-box;
  -webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pc-next::before{content:"→";color:var(--ink-4);margin-right:7px}
.pc-meta{display:flex;align-items:center;gap:12px;flex-wrap:wrap;font:400 var(--t-xs)/1.4 var(--f-mono);color:var(--ink-4);padding-top:2px}
.pc-meta a{color:var(--accent-hi)}
.pc-meta a:hover{text-decoration:underline}

/* ============================================================ funnel ===== */
.fstage{display:grid;grid-template-columns:132px minmax(0,1fr) 118px;align-items:center;gap:14px;padding:9px 0}
.fstage .k{display:flex;flex-direction:column;gap:3px;min-width:0}
.fstage .k b{font-size:var(--t-sm);font-weight:500;color:var(--ink-1)}
.fstage .k span{font:400 var(--t-label)/1 var(--f-mono);color:var(--ink-4);text-transform:uppercase;letter-spacing:.06em}
.fstage .bar{height:26px;border-radius:4px;background:var(--ink-3);min-width:3px}
.fstage.truth .bar{background:var(--live)}
.fstage .v{font:600 17px/1 var(--f-num);font-variant-numeric:tabular-nums;color:var(--ink-1);text-align:right}
.fstage .v em{display:block;font-style:normal;font:400 var(--t-xs)/1.4 var(--f-num);color:var(--ink-4);margin-top:5px}
.fdrop{display:grid;grid-template-columns:132px minmax(0,1fr) 118px;gap:14px}
.fdrop .mid{display:flex;align-items:center;gap:8px;padding:0 0 2px 2px}
.fdrop .tick{width:1px;height:12px;background:var(--hair3);flex:none}
.fdrop .txt{font:400 var(--t-xs)/1 var(--f-mono);color:var(--ink-4)}
.fdrop .txt b{color:var(--ink-3);font-weight:500}

/* ============================================================ activity === */
.act{display:flex;gap:3px;align-items:flex-end}
.act .cell{flex:1;min-width:5px;height:34px;border-radius:2px;background:rgba(255,255,255,.045);
  transition:transform var(--d1) ease;cursor:default}
.act .cell[data-l="1"]{background:rgba(155,207,63,.24)}
.act .cell[data-l="2"]{background:rgba(155,207,63,.44)}
.act .cell[data-l="3"]{background:rgba(155,207,63,.68)}
.act .cell[data-l="4"]{background:var(--live)}
.act .cell.today{outline:1px solid var(--hair3);outline-offset:1px}
.act .cell:hover{transform:scaleY(1.14)}
.actlab{display:flex;justify-content:space-between;font:400 var(--t-label)/1 var(--f-mono);color:var(--ink-4);margin-top:8px}

/* ============================================================ charts ===== */
.chart{width:100%;display:block}
.chart .grid-l{stroke:rgba(255,255,255,.055);stroke-width:1;shape-rendering:crispEdges}
.chart .zero-l{stroke:rgba(255,255,255,.13);stroke-width:1;shape-rendering:crispEdges}
.chart .ln{fill:none;stroke:var(--ink-1);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.chart .ln.acc{stroke:var(--accent-hi)}
.chart .ln.live{stroke:var(--live)}
.chart .bar{fill:var(--ink-3)}
.chart .bar.acc{fill:var(--accent)}
.chart .bar.live{fill:var(--live)}
.chart .bar.ghost{fill:rgba(255,255,255,.055)}
/* SVG font-size is in viewBox USER UNITS, so it shrinks with the chart: 11
   units in a 720-wide viewBox is 11px at 720 CSS px and 6px at 390. Any chart
   carrying <text> therefore lives in .cscroll and declares a min-width at or
   above its viewBox width, so the labels never render under the 11px floor. */
.chart text{fill:var(--ink-4);font:400 11px var(--f-num);font-variant-numeric:tabular-nums}
.cscroll{overflow-x:auto;overscroll-behavior-x:contain;min-width:0;max-width:100%}
.cscroll .chart{min-width:720px}
.chart .hit{fill:transparent}
.chart .cross{stroke:var(--hair3);stroke-width:1;opacity:0}
.chart .dot{opacity:0}
.chart.on .cross,.chart.on .dot{opacity:1}
.axl{display:flex;justify-content:space-between;font:400 var(--t-label)/1 var(--f-mono);color:var(--ink-4);margin-top:7px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:var(--t-xs);color:var(--ink-3);margin-bottom:11px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.bandlab{font:600 9.5px var(--f-ui);letter-spacing:.09em;fill:var(--ink-4)}
.tip{position:fixed;z-index:60;pointer-events:none;background:var(--elevated);border:1px solid var(--hair2);
  border-radius:var(--r-sm);padding:8px 10px;font:400 var(--t-xs)/1.55 var(--f-mono);color:var(--ink-2);
  box-shadow:0 12px 28px rgba(0,0,0,.55);white-space:nowrap;opacity:0;transition:opacity var(--d1) ease}
.tip.on{opacity:1}
.tip b{color:var(--ink-1);font-weight:600}

/* ============================================================ states ===== */
.empty-s{display:flex;flex-direction:column;align-items:center;gap:9px;padding:38px 20px;text-align:center}
.empty-s .t{font-size:var(--t-body);color:var(--ink-2);font-weight:500}
.empty-s .d{font-size:var(--t-sm);color:var(--ink-4);max-width:46ch;line-height:1.55}
.done-s{display:flex;align-items:center;gap:13px;padding:18px;border-radius:var(--r);
  background:linear-gradient(180deg,rgba(155,207,63,.06),transparent);border:1px solid var(--hair)}
.done-s .tick{width:28px;height:28px;border-radius:99px;background:var(--live-dim);color:var(--live);
  display:grid;place-items:center;flex:none;font-size:14px}
.done-s .t{font-size:var(--t-body);color:var(--ink-1);font-weight:500}
.done-s .d{font-size:var(--t-sm);color:var(--ink-3);line-height:1.5}

/* ============================================================ drawer ===== */
#scrim{position:fixed;inset:0;background:var(--scrim);z-index:40;animation:fade var(--d2) var(--ease)}
@keyframes fade{from{opacity:0}to{opacity:1}}
#drawer{position:fixed;top:0;right:0;bottom:0;width:min(460px,100vw);z-index:50;background:var(--page);
  border-left:1px solid var(--hair2);box-shadow:-24px 0 48px rgba(0,0,0,.5);display:flex;flex-direction:column;
  animation:slide var(--d3) var(--ease)}
@keyframes slide{from{transform:translateX(100%)}to{transform:none}}
#drawer[hidden]{display:none}
#drawer header{display:flex;align-items:flex-start;gap:12px;padding:16px 16px 13px;border-bottom:1px solid var(--hair);flex:none}
#drawer-title{min-width:0;flex:1;display:flex;flex-direction:column;gap:4px}
#drawer-title b{font:600 17px/1.3 var(--f-ui);color:var(--ink-1);letter-spacing:-.015em}
#drawer-title span{font:400 var(--t-xs)/1.35 var(--f-mono);color:var(--ink-4)}
#drawer-body{overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:19px}
.dsec{display:flex;flex-direction:column;gap:9px}
.dsec>.lab{color:var(--ink-4)}
.kv{display:grid;grid-template-columns:98px 1fr;gap:8px 12px;font-size:var(--t-sm)}
.kv dt{color:var(--ink-4);font-size:var(--t-xs);padding-top:2px}
.kv dd{margin:0;color:var(--ink-2);min-width:0;overflow-wrap:anywhere}
.quote{font-size:var(--t-sm);line-height:1.6;color:var(--ink-2);background:var(--panel);border:1px solid var(--hair);
  border-left:2px solid var(--hair3);border-radius:0 var(--r-sm) var(--r-sm) 0;padding:11px 13px}
.tl li{display:grid;grid-template-columns:14px 1fr;gap:10px;padding:7px 0;font-size:var(--t-sm)}
.tl .pip{width:7px;height:7px;border-radius:99px;background:var(--ink-4);margin:6px 0 0 3px}
.tl .pip.in{background:var(--accent)}
.tl .pip.ok{background:var(--pos)}
.tl .t{font:400 var(--t-xs)/1.5 var(--f-mono);color:var(--ink-4)}
.tl .d{color:var(--ink-2)}
.dact{display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 12px;border-radius:var(--r-sm);
  border:1px solid var(--hair2);font-size:var(--t-sm);font-weight:500;color:var(--ink-2);background:var(--panel);
  transition:background var(--d1) ease,border-color var(--d1) ease,color var(--d1) ease}
.btn:hover{background:var(--raised);border-color:var(--hair3);color:var(--ink-1)}
.btn.pri{background:var(--accent-solid);border-color:var(--accent-solid);color:#fff}
.btn.pri:hover{background:var(--accent-solid-hi);border-color:var(--accent-solid-hi)}

/* ============================================================ dialogs ==== */
dialog{border:0;padding:0;background:transparent;color:inherit;max-width:none;max-height:none}
dialog::backdrop{background:rgba(0,0,0,.62)}
#cmdk{position:fixed;top:13vh;left:50%;transform:translateX(-50%);width:min(620px,calc(100vw - 28px));
  box-shadow:0 26px 64px rgba(0,0,0,.6)}
#keys{position:fixed;top:14vh;left:50%;transform:translateX(-50%);width:min(560px,calc(100vw - 28px));
  box-shadow:0 26px 64px rgba(0,0,0,.6)}
#cmdk[open],#keys[open]{animation:pop var(--d2) var(--ease)}
@keyframes pop{from{opacity:0;transform:translateX(-50%) translateY(-6px)}to{opacity:1;transform:translateX(-50%)}}
.cmdk-in{display:flex;align-items:center;gap:10px;padding:0 14px;height:50px;background:var(--elevated);
  border:1px solid var(--hair2);border-bottom:0;border-radius:var(--r-lg) var(--r-lg) 0 0;color:var(--ink-4)}
#cmdk-q{flex:1;min-width:0;border:0;background:none;outline:0;font-size:15px;color:var(--ink-1)}
#cmdk-q::placeholder{color:var(--ink-4)}
#cmdk-list{max-height:min(56vh,440px);overflow-y:auto;background:var(--elevated);
  border-left:1px solid var(--hair2);border-right:1px solid var(--hair2)}
#cmdk-list .grp{font:600 var(--t-label)/1 var(--f-ui);letter-spacing:.09em;text-transform:uppercase;
  color:var(--ink-4);padding:13px 14px 6px}
#cmdk-list li[role="option"]{display:flex;align-items:center;gap:11px;padding:0 14px;height:42px;cursor:pointer}
#cmdk-list li[aria-selected="true"]{background:var(--raised)}
#cmdk-list li b{font-weight:500;font-size:var(--t-sm);color:var(--ink-1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#cmdk-list li mark{background:none;color:var(--accent-hi);font-weight:700}
#cmdk-list li .h{font:400 var(--t-xs)/1 var(--f-mono);color:var(--ink-4);margin-left:auto;white-space:nowrap;flex:none}
#cmdk-list .none{padding:26px 14px;text-align:center;color:var(--ink-4);font-size:var(--t-sm)}
.cmdk-foot{display:flex;gap:16px;padding:9px 14px;background:var(--elevated);border:1px solid var(--hair2);
  border-top:1px solid var(--hair);border-radius:0 0 var(--r-lg) var(--r-lg);font-size:var(--t-xs);color:var(--ink-4)}
.cmdk-foot kbd{margin-right:4px}
#keys h2{font:600 15px/1 var(--f-ui);color:var(--ink-1);padding:16px 16px 6px;background:var(--elevated);
  border:1px solid var(--hair2);border-bottom:0;border-radius:var(--r-lg) var(--r-lg) 0 0}
#keys-body{background:var(--elevated);border-left:1px solid var(--hair2);border-right:1px solid var(--hair2);
  padding:8px 16px 14px;display:grid;grid-template-columns:1fr 1fr;gap:2px 24px}
#keys-body div{display:flex;align-items:center;gap:10px;height:30px;font-size:var(--t-sm);color:var(--ink-3)}
#keys-body div span{margin-left:auto;display:flex;gap:3px;flex:none}

/* ============================================================ responsive = */
@media (max-width:1180px){.split{grid-template-columns:minmax(0,1fr)}}
@media (max-width:900px){.g2,.g3{grid-template-columns:minmax(0,1fr)}}
@media (max-width:820px){
  #app{grid-template-columns:1fr}
  #rail{position:fixed;left:0;top:0;bottom:0;z-index:45;width:244px;transform:translateX(-101%);
    transition:transform var(--d3) var(--ease);background:var(--page)}
  html[data-rail="open"] #rail{transform:none;box-shadow:24px 0 48px rgba(0,0,0,.5)}
  /* Dimmer for the off-canvas rail, drawn by #main rather than a real node so
     a tap anywhere outside the rail targets #main and closes it. */
  #main::before{content:"";position:fixed;inset:0;z-index:44;background:var(--scrim);
    opacity:0;pointer-events:none;transition:opacity var(--d2) var(--ease)}
  html[data-rail="open"] #main::before{opacity:1;pointer-events:auto}
  html[data-rail="collapsed"]{--rail:244px}
  html[data-rail="collapsed"] .brand-txt,html[data-rail="collapsed"] .railsearch span,
  html[data-rail="collapsed"] .railsearch kbd,html[data-rail="collapsed"] .nav-a .lbl,
  html[data-rail="collapsed"] .nav-sec,html[data-rail="collapsed"] .rail-foot{display:revert}
  html[data-rail="collapsed"] .nav-a{justify-content:flex-start;padding:0 9px}
  html[data-rail="collapsed"] .railsearch{justify-content:flex-start;padding:0 9px}
  html[data-rail="collapsed"] .nav-a .cnt{position:static}
  .only-narrow{display:grid}
  #rail-toggle{display:none}
  #topbar{padding:0 14px;gap:10px;height:52px}
  #view{padding:14px}
  .tw{max-height:calc(100dvh - 186px)}
  .hero{grid-template-columns:minmax(0,1fr)}
  .hero-v{font-size:38px}
  .fstage,.fdrop{grid-template-columns:92px minmax(0,1fr) 78px;gap:10px}
  .fstage .v{font-size:15px}
  #drawer{width:100vw}
  .q-btn{display:none}
  .pc-body{padding-left:16px}
  .kv{grid-template-columns:84px 1fr}
  #keys-body{grid-template-columns:1fr}
}
@media (max-width:420px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
@media print{
  #rail,#topbar,#cmdk,#keys,#drawer,#scrim,.q-btn{display:none!important}
  #app{display:block;height:auto}
  #view{overflow:visible;padding:0}
  .panel{break-inside:avoid}
  *{print-color-adjust:exact;-webkit-print-color-adjust:exact}
  @page{size:A4 landscape;margin:12mm}
}
</style>
</head>

<div id="app">

        <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span>

        <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true"><rect x="2.5" y="3" width="11" height="10" rx="2" fill="none" stroke="currentColor" stroke-width="1.2"/><path d="M6.5 3v10" stroke="currentColor" stroke-width="1.2"/></svg>
      </button>
    </div>

    <button id="open-cmdk" class="railsearch" aria-label="Search everything">
      <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><circle cx="7" cy="7" r="4.5" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M10.5 10.5L14 14" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
      <span>Search…</span><kbd>⌘K</kbd>
    </button>

    <nav id="nav" aria-label="Primary"></nav>

    <div class="rail-foot"><div id="freshness"></div></div>
  </aside>

  <div id="main">
    <header id="topbar">
      <button id="rail-open" class="icon-btn only-narrow" aria-label="Open menu">
        <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M2 4h12M2 8h12M2 12h12" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
      </button>
      <div class="crumb"><h1 id="page-title">Today</h1><p id="page-sub"></p></div>
      <div class="topbar-right">
        <div id="tabs" role="tablist"></div>
        <button id="open-cmdk-2" class="icon-btn only-narrow" aria-label="Search">
          <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true"><circle cx="7" cy="7" r="4.5" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M10.5 10.5L14 14" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>

    <main id="view" tabindex="-1"></main>
  </div>
</div>

<div id="scrim" hidden></div>

<aside id="drawer" aria-label="Record detail" hidden>
  <header>
    <div id="drawer-title"></div>
    <button id="drawer-close" class="icon-btn" aria-label="Close">
      <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
    </button>
  </header>
  <div id="drawer-body"></div>
</aside>

<dialog id="cmdk" aria-label="Command palette">
  <div class="cmdk-in">
    <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true"><circle cx="7" cy="7" r="4.5" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M10.5 10.5L14 14" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
    <input id="cmdk-q" autofocus autocomplete="off" spellcheck="false" placeholder="Jump to a client, a lead, a screen…" role="combobox" aria-expanded="true" aria-controls="cmdk-list">
    <kbd>esc</kbd>
  </div>
  <ul id="cmdk-list" role="listbox"></ul>
  <footer class="cmdk-foot"><span><kbd>↑</kbd><kbd>↓</kbd> move</span><span><kbd>↵</kbd> open</span><span><kbd>?</kbd> shortcuts</span></footer>
</dialog>

<dialog id="keys" aria-label="Keyboard shortcuts">

  <div id="keys-body"></div>
  <footer class="cmdk-foot"><span>press <kbd>esc</kbd> to close</span></footer>
</dialog>

о клиентов один человек тянет за раз. Поэтому четыре из восьми припаркованы намеренно, верх воронки закрыт, и каждый час идёт в то, чтобы следующая сборка стоила меньше. Плейбук пишется по ходу, в clients projects/README.md — отдельной остановки на «кодифицировать» не будет.","severity":"high"},{"n":4,"title":"Клиентские репы → один приватный монореп на GitHub","text":"Решение принято 17.08: не внешний диск и не пять отдельных реп — ОДИН приватный репозиторий, все клиенты папками. Одна учётка, один git push, ноль шансов забыть одну из пяти. Осталось исполнить: создать реп, перенести пять сборочных реп (subtree сохранит короткие истории). Задача TODO #13.","severity":"medium"},{"n":5,"title":"/level-up перестроить: сначала читать логи","text":"Сейчас он интервьюирует Mra — то есть ровно тот ручной шаг, который он и пытается убрать. Должен читать логи сессий, вывод воркфлоу и ошибки скриптов, а потом приносить ОДНОГО кандидата с доказательством. Решено 08.08. Очередь работ ведёт это как TODO #2.","severity":"medium"},{"n":6,"title":"Автоматизированный органический трафик + SMM: направление есть, формы нет","text":"Решение 17.08. Что хочет Mra: авто-DM квалификация лидов, воронка с автоматическим ответом на комментарии, органический охват без платного трафика. «dont know yet how and what» — ни инструмента, ни плана, ни платформы не выбрано. Следующее реальное решение в контенте — выбрать «как». Сначала себе (@voronka.tm), потом клиентам: если работает — это продукт. Рабочий пункт живёт в TODO #4 — эта строка про направление, а не про очередь.","severity":"medium"},{"n":7,"title":"Кейс-пост так и не написан","text":"Самый важный контент-кусок из всех (funnel/01-instagram.md). Формулировка сдержанная, по core («примерно по паре долларов за клиента…», никогда «$2 CAC»). С него же снимается хайлайт «Кейс».","severity":"medium"},{"n":8,"title":"Фильтр внутреннего трафика в GA4 — закрыт как бессмысленный","text":"Mra, 17.08: в этом рынке каждый визит идёт через VPN — гео и часы в GA4 ненадёжны для ВСЕЙ аудитории, не только для его собственных визитов, и фильтрация одного IP ничего не чинит. Постоянное правило: не строить решения на гео/часах GA4 в Туркменистане; устройство, источник и пути по странице остаются надёжными.","severity":"low","closed":true},{"n":9,"title":"Каждый провал генерации → сразу правило в brand/content-rules.md","text":"Это и есть механизм накопления. Не «в следующий раз аккуратнее», а строка в законе.","severity":"low"},{"n":10,"title":"Прогнать /grill-me по звонкам","text":"brain/ построен на том, что лиды ГОВОРИЛИ — на письменном логе. Он не может знать, что Mra УСЛЫШАЛ: тон, какие фразы питча заходили, где разговор поворачивал. Сессия 08.08 уже дала одну такую находку (петля #2); остальное лежит у него в голове, и поставить это может только он.","severity":"medium"}],"todo":[{"n":1,"title":"Закоммитить работу во всех клиентских репах","importance":"высокая","urgency":"—","where":"D:\\ai projects\\clients\\*, D:\\ai projects\\voronka","status":"сделано 10.08","note":"Все пять репозиториев чисты, диффы прогнаны на токены. Осталось за рамкой: ни у одного нет remote — приватные репы на GitHub или внешний диск, одно решение."},{"n":2,"title":"Перестроить /level-up: читать логи, а не спрашивать","importance":"высокая","urgency":"до ближайшей пятницы","where":".claude/skills/level-up","status":"не начато","note":"Должен сначала читать (логи сессий, вывод скриптов, ошибки, историю воркфлоу) и приносить одного кандидата с доказательством, а не интервьюировать Mra."},{"n":3,"title":"Вернуть суточные снимки","importance":"средняя","urgency":"сегодня — строки нет за 10.08","where":"/check-full, automations/snapshot.py","status":"почти закрыто","note":"«Дыры» не было — это утверждение было неверным: 04–09.08 добраны 09.08 в 02:01, просто лежали незакоммиченными (исправлено 10.08). Что осталось: строка за 10.08 — нужен /check-full на машине Mra с VPN."},{"n":4,"title":"Контент-план на 4 недели + автоматизация SMM","importan ов на лида; нужен resolved-handles.json: сырой ответ → найденный ник."},{"n":11,"title":"Починить дрейф в 04-lead-capture.md","importance":"низкая","urgency":"когда угодно","where":"funnel/04-lead-capture.md","status":"не начато","note":"Файл утверждает, что вопрос про ник не в проде; в CRM 47 ответов, введённых руками. Документ отстал на шаг воронки."},{"n":12,"title":"Проверить гипотезу «страшно отдавать аккаунт»","importance":"низкая","urgency":"на звонках следующей кампании","where":"звонки","status":"отложено","note":"Один лид написал в поле ника «Это не опасно»; семеро ответили «нет Instagram». Возвращается на лидах следующей кампании."},{"n":13,"title":"Поднять клиентские репы на GitHub — один приватный монорепозиторий","importance":"средняя","urgency":"до первого сбоя диска","where":"GitHub + D:\\ai projects\\clients\\*","status":"решение принято 17.08, не начато","note":"Все пять сборочных реп живут только на этой машине. Решение: один приватный реп, все клиенты папками. Создать реп → перенести пять реп (subtree сохранит истории) → проверить git status в каждой. Нужна авторизация Mra на GitHub."}]},"drifted":[],"queue":[{"group":"broken","rank":10,"title":"HIMIYA HOUSE — заявки уходят в никуда","meta":"https://himiahouse.pages.dev","why":"Форма мёртвая: /api/lead отвечает {\"ok\":true}, а оба стока возвращают skipped — в переменных проекта Pages нет TG_BOT_TOKEN / TG_CHAT_ID / SHEETS_WEBHOOK_URL. Ссылка у неё на руках: если она сама нажмёт «отправить», заявка исчезнет за экраном «Спасибо». Принято осознанно 08.08 — чинится, когда появится креатив, потому что до креатива запускать всё равно нечего.","action":"Позвонить и напомнить — ссылку отправили, просили обратную связь, тишина. Дальше: прайс + маржа (spec §8 в1) → заменить 13 заглушек цен из 19. GA4-тег починен в источнике 10.08 (GA4_ID был ПУСТОЙ строкой — не «неправильный ID», а ни одного запроса gtag за всю жизнь страницы; данных не восстановить), но фикс НЕ задеплоен и не работает, пока страница не п /* All SVG, authored in real pixel space so 1px rules stay crisp. The +0.5

function px(v){ return Math.round(v) + 0.5; }

/* Bars over a daily series. Three distinct states, never collapsed:

function dayBars(series, key, opts){
  opts = opts || {};
  var W = 100, H = opts.h || 64, pad = 3, n = series.length;
  var vals = series.map(function(s){ return s.missing ? null : s[key]; });

/* A dual histogram around a shared baseline: leads arriving (up) against calls

function parseHash(){
  var raw = location.hash.slice(1) || "/today";
  var qi = raw.indexOf("?");
  var path = (qi < 0 ? raw : raw.slice(0, qi)).replace(/^\/+/, "").split("/");
  var q = new URLSearchParams(qi < 0 ? "" : raw.slice(qi+1));
  var sec = ROUTES[path[0]] ? path[0] : "today";
  var tabs = ROUTES[sec].tabs, tab = path[1] || (tabs.length ? tabs[0][0] : "");
  if (tabs.length && !tabs.some(function(t){ return t[0] === tab; })) tab = tabs[0][0];
  return { sec:sec, tab:tab, q:q };
}
function href(sec, tab, params){
  var s = "#/" + sec + (tab ? "/" + tab : "");
  if (params){ var p = new URLSearchParams(params).toString(); if (p) s += "?" + p; }
  return s;
}
/* replaceState for filter tweaks so Back doesn't walk through every keystroke.
   Chromium reports a file: document's origin as "file://" and allows a
   hash-only replaceState; other engines treat it as opaque and throw. Falling
   back to location.hash costs a history entry, never a broken filter. */
function setQuery(mutate, push){
  var q = new URLSearchParams(route.q);
  mutate(q);
  var url = href(route.sec, route.tab, q);
  if (push){ location.hash = url.slice(1); return; }
  try { history.replaceState(null, "", url); }
  catch (e) { location.hash = url.slice(1); return; }
  route.q = q; render();
}

  dialled:function(a,b){ return a.dialled - b.dialled; },
  category:function(a,b){ return coll.compare(a.category||"яя", b.category||"яя"); },

  if (!C) return [];

  if (tab === "uncalled")  return C.never_dialled.map(function(i){ return LEADS[i]; });

function applyFilters(list){
  var q = (route.q.get("q")||"").trim().toLowerCase();
  var cr = route.q.get("cr"), lg = route.q.get("lg"), bs = route.q.get("bs");
  return list.filter(function(L){
    if (cr && L.creative !== cr) return false;
    if (lg && L.language !== lg) return false;
    if (bs && L.business !== bs) return false;
    if (q){
      var hay = [L.business, L.language, L.handle, L.name, L.note, L.phone, L.category, L.creative, L.label]
        .join(" ").toLowerCase();
      if (hay.indexOf(q) < 0) return false;
    }
    return true;
  });
}

/* ------------------------------------------------------------- funnel --- */
function viewFunnel(){
  if (route.tab === "creatives") return viewCreatives();
  if (route.tab === "segments")  return viewSegments();

  var f = S.funnel, r = S.rates, m = S.money;
  /* Four orders of magnitude between stage 1 and stage 5. On one linear scale
     four of five bars pin to the floor; log or sqrt would flatter the data. So
     the scale BREAKS after impressions and the break is drawn and named. */
  var head = f[0], rest = f.slice(1);
  var restMax = Math.max.apply(null, rest.map(function(s){ return s.value || 0; })) || 1;
  var zoom = head.value && restMax ? Math.round(head.value / restMax) : null;

  function row(s, w, prev){
    var conv = prev && prev.value ? (100 * (s.value||0) / prev.value) : null;
    return (prev ? '<div class="fdrop"><div></div><div class="mid"><span class="tick"></span>'
        + '<span class="txt"><b>'+(conv==null?"—":conv.toFixed(conv<10?1:0)+"%")+'</b> of '+esc(prev.label.toLowerCase())+'</span>'
        + '</div><div></div></div>' : "")
      + '<div class="fstage'+(s.truth?" truth":"")+'"><div class="k"><b>'+esc(s.label)+'</b><span>'+esc(s.source)+'</span></div>'
      + '<div><div class="bar" style="width:'+w.toFixed(2)+'%"></div></div>'
      + '<div class="v">'+n(s.value)+(s.truth?'<em>truth</em>':"")+'</div></div>';
  }
  var body = row(head, 100, null)
    + '<div class="fdrop" style="margin:6px 0"><div></div><div class="mid" style="gap:10px">'
      + '<span style="flex:1;height:1px;background:repeating-linear-gradient(90deg,var(--hair3) 0 4px,transparent 4px 8px)"></span>'
      + '<span class="txt">scale break · the four stages below are drawn against link clicks'+(zoom?" (×"+n(zoom)+" zoom)":"")+'</span>'
      + '<span style="flex:1;height:1px;background:repeating-linear-gradient(90deg,var(--hair3) 0 4px,transparent 4px 8px)"></span>'
      + '</div><div></div></div>';
  rest.forEach(function(s, i){
    body += row(s, Math.max(0.6, 100 * (s.value||0) / restMax), i === 0 ? head : rest[i-1]);
  });

  var rec = S.reconciliation;
  var recBody = '<div class="rows">'
    + '<div class="brow"><div class="k">Meta pixel</div><div class="track"><div class="fill" style="width:'+(100*rec.meta_leads/Math.max(rec.crm_leads_real,1)).toFixed(1)+'%"></div></div><div class="v">'+n(rec.meta_leads)+'</div></div>'
    + '<div class="brow"><div class="k">GA4 submits</div><div class="track"><div class="fill" style="width:'+(100*rec.ga4_generate_lead/Math.max(rec.crm_leads_real,1)).toFixed(1)+'%"></div></div><div class="v">'+n(rec.ga4_generate_lead)+'</div></div>'
    + '<div class="brow on"><div class="k">Sheet CRM</div><div class="track"><div class="fill" style="width:100%"></div></div><div class="v">'+n(rec.crm_leads_real)+'</div></div>'
    + '</div><p class="note" style="margin-top:12px">Only the Sheet is truth. Meta reports '+n(rec.meta_leads)
    + ' against '+n(rec.crm_leads_real)+' real — a '+Math.abs(100*(rec.meta_leads-rec.crm_leads_real)/Math.max(rec.crm_leads_real,1)).toFixed(1)
    + '% gap. The old "pixel undercounts by 18%" rule was attribution lag inside a running campaign, not a systematic bias. Do not correct pixel figures.</p>';

  var eff = '<div class="stats">'
    + stat("Spend", money(m.spend), "lifetime, this window")
    + stat("Per link click", money(m.cost_per_link_click, 3), "")
    + stat("Per real заявка", money(m.cost_per_real_lead), "Sheet CRM denominator", "acc")
    + stat("Per answered call", C ? money(m.spend / Math.max(C.calls.answered,1)) : "—", C ? C.calls.answered + " answered" : "")
    + stat("Per closed pilot", money(m.spend / Math.max(PIPE.length,1)), PIPE.length + " pilots agreed", "acc")
    + '</div>';

  return '<div class="stack">'
    + panel("Efficiency", "what the money actually bought", eff, "", true)
    + panel("The chain", S.window.start + " → " + S.window.end, body)
    + '<div class="grid g2">'
      + panel("Three counts of the same event", "and why only one is truth", recBody)
      + panel("Not in this line, deliberately", "two stages that would lie",
          '<dl class="kv"><dt>Meta LPV</dt><dd>runs ~44% low against GA4 — the Instagram in-app browser drops the pixel while the GA4 tag survives. Stored, never divided by.</dd>'
          + '<dt>CF pageviews</dt><dd>~7× bot-inflated on the Free plan, which has no bot-management field to filter on. A ceiling, not a count.</dd></dl>')
    + '</div></div>';
}

        + '<dt>Ashgabat dates</dt><dd>Meta, GA4 and the Sheet all report in it, so they line up day for day. Cloudflare is UTC and sits 5 hours off, which is why nothing from it enters the funnel.</dd>'

    + '</div></div>';

    + '</dl>' : '<p class="note dim">Handle never resolved'+(L.handle_raw?' — they typed «'+esc(L.handle_raw)+'»':"")+'.</p>';

  return '<div class="dsec"><div class="dact">'
      + (L.digits ? '<a class="btn pri" href="'+esc(phoneHref(L.digits))+'">Call '+esc(L.phone)+'</a>' : "")
      + (L.handle ? '<a class="btn" href="https://instagram.com/'+esc(L.handle)+'" target="_blank" rel="noopener">Instagram</a>' : "")
      + '</div></div>'
    + '<div class="dsec"><span class="lab">Заявка</span><dl class="kv">'
      + '<dt>Arrived</dt><dd>'+esc((L.ts||"").replace("T"," "))+' · '+ago(L.days)+' ago</dd>'
      + '<dt>Business</dt><dd>'+esc(L.business||"—")+'</dd>'
      + '<dt>Language</dt><dd>'+esc(L.language||"—")+'</dd>'
      + '<dt>Creative</dt><dd>'+esc(L.creative||"unattributed")+(L.variant?' · variant '+esc(L.variant):"")+'</dd>'
      + '</dl></div>'
    + (L.category || L.note ? '<div class="dsec"><span class="lab">What was said</span>'
      + (L.category ? '<div class="rowflex"><span class="badge'+(L.category==="интерес"?" live":" warn")+'">'+esc(L.category)+'</span>'
        + L.objections.map(function(o){ return '<span class="badge bad">'+esc(o)+'</span>'; }).join("") + '</div>' : "")
      + (L.note ? '<div class="quote">'+esc(L.note)+'</div>' : "")
      + (L.follow_up ? '<p class="note">→ '+esc(L.follow_up)+'</p>' : "") + '</div>' : "")
    + '<div class="dsec"><span class="lab">Calls</span>'
      + '<dl class="kv"><dt>To first call</dt><dd>'+mins(L.mtc)+'</dd>'
      + '<dt>Talk total</dt><dd>'+dur(L.talk)+(L.talk_longest?' · longest '+dur(L.talk_longest):"")+'</dd>'
      + '<dt>They rang back</dt><dd>'+(L.called_back?"yes":"no")+(L.missed_from_them?' · '+L.missed_from_them+' missed from them':"")+'</dd></dl>'
      + callRows + '</div>'
    + '<div class="dsec"><span class="lab">Instagram</span>'+prof+(L.bio?'<div class="quote">'+esc(L.bio)+'</div>':"")+'</div>'
    + (qa ? '<div class="dsec"><span class="lab">Chat log</span>'+qa+'</div>' : "");
}

function drawerPilot(p){
  return '<div class="dsec"><div class="rowflex">'
      + srail(p.stage_i)
      + (p.state==="broken"?'<span class="badge bad">заявки в никуда</span>':p.state==="blocked"?'<span class="badge warn">blocked</span>':'<span class="badge live">moving</span>')
      + (p.noindex?'<span class="badge">noindex</span>':"")
      + '</div>'
      + (p.deploy_url ? '<div class="dact" style="margin-top:10px"><a class="btn pri" href="'+esc(p.deploy_url)+'" target="_blank" rel="noopener">Open the page</a></div>' : "")
      + '</div>'
    + (p.blocker ? '<div class="dsec"><span class="lab">Blocker</span><div class="quote">'+esc(p.blocker)+'</div></div>' : "")
    + (p.next_action ? '<div class="dsec"><span class="lab">Next action</span><p class="note" style="color:var(--ink-2)">'+esc(p.next_action)+'</p></div>' : "")
    + (p.highlight ? '<div class="dsec"><span class="lab">What is built</span><p class="note">'+esc(p.highlight)+'</p></div>' : "")
    + '<div class="dsec"><span class="lab">Record</span><dl class="kv">'
      + '<dt>Rank</dt><dd>'+p.rank+' of '+PIPE.length+'</dd>'
      + '<dt>Stage</dt><dd>'+esc(p.stage)+'</dd>'
      + '<dt>Niche</dt><dd>'+esc(p.niche||"—")+'</dd>'
      + '<dt>Deal</dt><dd>$'+n(p.deal_usd)+' + '+(B.offer?B.offer.free_campaigns_per_client:3)+' free campaigns ('+p.free_campaigns_used+' used)</dd>'
      + '<dt>Last touch</dt><dd>'+esc(p.last_touch||"—")+' · idle '+ago(p.idle)+'</dd>'
      + (p.deployed_on ? '<dt>Deployed</dt><dd>'+esc(p.deployed_on)+'</dd>' : "")
      + '<dt>Slug</dt><dd class="mono">'+esc(p.slug)+'</dd>'
      + (p.build_repo ? '<dt>Build repo</dt><dd class="mono">'+esc(p.build_repo)+'</dd>' : "")
      + '</dl></div>';
}

function drawDrawer(){
  var rec = route.q.get("rec"), d = el("drawer");
  if (!rec){ d.hidden = true; el("scrim").hidden = true; return; }
  var title = "", sub = "", body = "";
  if (route.sec === "leads" && LEADS[+rec]){
    var L = LEADS[+rec];
    title = L.business || L.phone || "Заявка";
    sub = (L.label ? L.label + " · " : "") + dtime(L.ts) + " · " + (L.phone || "no phone");
    body = drawerLead(L);
  } else {
    var p = PIPE.filter(function(x){ return x.slug === rec; })[0];
    if (!p){ d.hidden = true; el("scrim").hidden = true; return; }
    title = p.name; sub = p.slug; body = drawerPilot(p);
  }
  el("drawer-title").innerHTML = '<b>'+esc(title)+'</b><span>'+esc(sub)+'</span>';
  el("drawer-body").innerHTML = body;
  el("drawer-body").scrollTop = 0;
  d.hidden = false; el("scrim").hidden = false;
}

/* ------------------------------------------------------------- render --- */
var VIEWS = { today:viewToday, pipeline:viewPipeline, leads:viewLeads,
              funnel:viewFunnel, marketing:viewMarketing, system:viewSystem };

function paint(){
  var meta = ROUTES[route.sec];
  el("page-title").textContent = meta.title;
  el("page-sub").textContent = meta.sub;
  document.title = meta.title + " · VAIOS";

  var tabCounts = {};
  if (C){ tabCounts.callbacks = C.debt.length; tabCounts.uncalled = C.calls.never_dialled;
          tabCounts.won = C.won.length; tabCounts.all = C.leads_real; }
  el("tabs").innerHTML = meta.tabs.map(function(t){
    return '<a class="tab" role="tab" href="'+href(route.sec, t[0])+'" aria-selected="'+(t[0]===route.tab)+'">'
      + esc(t[1]) + (tabCounts[t[0]] != null ? '<b>'+tabCounts[t[0]]+'</b>' : "") + '</a>';
  }).join("");

  [].forEach.call(document.querySelectorAll(".nav-a"), function(a){
    if (a.dataset.sec === route.sec) a.setAttribute("aria-current","page");
    else a.removeAttribute("aria-current");
  });

  el("view").innerHTML = VIEWS[route.sec]();
  el("view").scrollTop = 0;
  drawDrawer();
  wireView();
}
function render(){
  /* Same-document view transitions turn a hash change into something that
     reads as an app rather than a reload. Keyboard-initiated navigation skips
     it on purpose: motion on an action you perform 100 times a day reads as
     lag, not polish. */
  if (document.startViewTransition && !kbNav) document.startViewTransition(paint);
  else paint();
  kbNav = false;
}
var kbNav = false;

/* -------------------------------------------------------------- wiring -- */
var cursor = -1;

/* #view survives every paint — only its innerHTML changes. So this delegated
   listener is attached ONCE at boot. Re-attaching it per render silently
   stacks handlers, and a chip that toggles twice looks like a chip that does
   nothing. */
function wireOnce(){
  el("view").addEventListener("click", function(e){
    var chip = e.target.closest("[data-filter]");
    if (chip){
      var p = chip.dataset.filter, val = chip.dataset.val;
      setQuery(function(q){ q.get(p) === val ? q.delete(p) : q.set(p, val); });
      return;
    }
    if (e.target.closest("[data-clear]")){
      setQuery(function(q){ ["q","cr","lg","bs"].forEach(function(k){ q.delete(k); }); });
      return;
    }
    var th = e.target.closest("th[data-sort]");
    if (th){
      var k = th.dataset.sort, cur = route.q.get("s") || "ts";
      setQuery(function(q){ q.set("s", k); q.set("d", cur === k && route.q.get("d") !== "a" ? "a" : "d"); });
      return;
    }
    var rec = e.target.closest("[data-rec]");
    if (rec){ openRec(rec.dataset.rec); return; }
    var q = e.target.closest(".q[data-href]");
    if (q && q.dataset.href){ location.hash = q.dataset.href.slice(1); return; }
  });
}

/* Per-paint wiring: everything below hangs off nodes that innerHTML just
   replaced, so it must run again — and only these. */
function wireView(){
  var lq = el("lead-q");
  if (lq){
    var t;
    lq.addEventListener("input", function(){
      clearTimeout(t);
      t = setTimeout(function(){
        var pos = lq.selectionStart, val = lq.value;
        setQuery(function(q){ val ? q.set("q", val) : q.delete("q"); });
        var again = el("lead-q");
        if (again){ again.focus(); again.setSelectionRange(pos, pos); }
      }, 160);
    });
  }
  cursor = -1;
  wireCharts();
}

/* One delegated mousemove per chart beats one invisible rect per bar. */
var tip;
function wireCharts(){
  if (!tip){ tip = document.createElement("div"); tip.className = "tip"; document.body.appendChild(tip); }
  [].forEach.call(document.querySelectorAll('svg[data-chart="days"]'), function(svg){
    var key = svg.dataset.key;
    svg.addEventListener("mousemove", function(e){
      var r = svg.getBoundingClientRect();
      var i = Math.floor((e.clientX - r.left) / r.width * S.series.length);
      if (i < 0 || i >= S.series.length) return;
      var s = S.series[i], val = s.missing ? null : s[key];
      tip.innerHTML = '<b>' + s.date + '</b><br>'
        + (s.missing ? "no snapshot written"
           : val == null ? "reader failed: " + (s.failed||[]).join(", ")
           : (key === "spend" ? "$" + val.toFixed(2) : n(val)) + " " + key.replace("_"," ")
             + (s.final ? "" : " · still moving"));
      tip.style.left = Math.min(Math.max(e.clientX - 60, 8), innerWidth - 190) + "px";
      tip.style.top = (r.top - 52) + "px";
      tip.classList.add("on");
    });
    svg.addEventListener("mouseleave", function(){ tip.classList.remove("on"); });
  });
}

/* --------------------------------------------------------- cmd palette -- */
var CMDS = [];
function buildCommands(){
  CMDS = [];
  Object.keys(ROUTES).forEach(function(k){
    var r = ROUTES[k];
    CMDS.push({ g:"Go to", label:r.title, hint:"g " + k[0], key:r.title + " " + r.sub, go:href(k,"") });
    r.tabs.forEach(function(t){
      CMDS.push({ g:"Go to", label:r.title + " · " + t[1], hint:"", key:r.title+" "+t[1], go:href(k,t[0]) });
    });
  });
  PIPE.forEach(function(p){
    CMDS.push({ g:"Pilots", label:p.name, hint:p.stage,
      key:[p.name,p.slug,p.niche,p.blocker,p.next_action].join(" "),
      go:href("pipeline","board",{rec:p.slug}) });
  });
  LEADS.forEach(function(L){
    CMDS.push({ g:"Leads", label:(L.business||L.phone||"заявка") + (L.handle?" · @"+L.handle:""),
      hint:L.category || dshort(L.day),
      key:[L.business,L.handle,L.name,L.phone,L.note,L.category,L.language,L.label].join(" "),
      go:href("leads","all",{rec:L.i}) });
  });
  (B.open_loops||[]).forEach(function(L){
    CMDS.push({ g:"Open loops", label:L.title, hint:L.severity, key:L.title+" "+(L.text||""), go:href("system","loops") });
  });
  (B.todo||[]).forEach(function(t){
    CMDS.push({ g:"Tasks", label:t.title, hint:t.importance, key:t.title+" "+(t.where||""), go:href("system","tasks") });
  });
}

/* Subsequence match with adjacency, word-start and prefix bonuses. Enough to
   rank "перезв" above a substring hit halfway through a note, and small enough
   to inline. */
function score(hay, needle){
  var h = hay.toLowerCase(), q = needle.toLowerCase();
  if (!q) return 0;
  if (h.indexOf(q) === 0) return 1000;
  var direct = h.indexOf(q);
  if (direct > 0) return 600 - Math.min(direct, 200);
  var hi = 0, s = 0, run = 0;
  for (var qi = 0; qi < q.length; qi++){
    var f = h.indexOf(q[qi], hi);
    if (f < 0) return -1;
    if (f === hi && qi > 0){ run += 5; s += 5 + run; }
    else { run = 0; s += 1; if (f === 0 || /[\s@._\-/·]/.test(h[f-1])) s += 10; }
    hi = f + 1;
  }
  return s;
}
function cmdkRender(){
  var q = el("cmdk-q").value.trim();
  var list = CMDS;
  if (q){
    list = CMDS.map(function(c){ return { c:c, s:score(c.label + " " + c.key, q) }; })
      .filter(function(x){ return x.s > 0; })
      .sort(function(a,b){ return b.s - a.s; })
      .slice(0, 40).map(function(x){ return x.c; });
  } else {
    list = CMDS.filter(function(c){ return c.g === "Go to"; }).slice(0, 12);
  }
  var out = "", lastG = null;
  list.forEach(function(c, i){
    if (c.g !== lastG){ out += '<li class="grp" aria-hidden="true">'+esc(c.g)+'</li>'; lastG = c.g; }
    out += '<li role="option" id="cmd-'+i+'" data-go="'+esc(c.go)+'" aria-selected="'+(i===cmdkI)+'">'
      + '<b>'+esc(c.label)+'</b>' + (c.hint ? '<span class="h">'+esc(c.hint)+'</span>' : "") + '</li>';
  });
  el("cmdk-list").innerHTML = out || '<div class="none">Nothing matches «'+esc(q)+'»</div>';
  var sel = el("cmdk-list").querySelector('[aria-selected="true"]');
  if (sel) sel.scrollIntoView({ block:"nearest" });
  el("cmdk-q").setAttribute("aria-activedescendant", sel ? sel.id : "");
}
var cmdkI = 0;
function cmdkOpen(){
  cmdkI = 0; buildCommands();
  var d = el("cmdk"); d.showModal(); el("cmdk-q").value = ""; cmdkRender(); el("cmdk-q").focus();
}
function cmdkMove(dir){
  var items = el("cmdk-list").querySelectorAll('[role="option"]');
  if (!items.length) return;
  cmdkI = (cmdkI + dir + items.length) % items.length;
  cmdkRender();
}
function cmdkGo(){
  var sel = el("cmdk-list").querySelector('[aria-selected="true"]');
  if (!sel) return;
  el("cmdk").close();
  location.hash = sel.dataset.go.slice(1);
}

/* ------------------------------------------------------------ keyboard -- */
var chord = null, chordAt = 0;
var KEYS = [
  ["Command palette","⌘K"],["Search this page","/"],["Shortcuts","?"],
  ["Today","g t"],["Pipeline","g p"],["Leads","g l"],["Funnel","g f"],
  ["Marketing","g m"],["System","g s"],["Move down / up","j k"],
  ["Open record","↵"],["Close","esc"],["Collapse sidebar","["],["Density","d"]
];
function drawKeys(){
  el("keys-body").innerHTML = KEYS.map(function(k){
    return '<div>'+esc(k[0])+'<span>'+k[1].split(" ").map(function(x){ return '<kbd>'+esc(x)+'</kbd>'; }).join("")+'</span></div>';
  }).join("");
}
function moveCursor(dir){
  var rows = el("view").querySelectorAll("tbody tr, .q, .pcard");
  if (!rows.length) return;
  if (cursor >= 0 && rows[cursor]) rows[cursor].classList.remove("cursor-row");
  cursor = Math.max(0, Math.min(rows.length - 1, cursor + dir));
  rows[cursor].classList.add("cursor-row");
  rows[cursor].scrollIntoView({ block:"nearest" });
}
function activateCursor(){
  var rows = el("view").querySelectorAll("tbody tr, .q, .pcard");
  if (cursor < 0 || !rows[cursor]) return;
  var r = rows[cursor];
  if (r.dataset.rec) openRec(r.dataset.rec);
  else if (r.dataset.href) location.hash = r.dataset.href.slice(1);
}

document.addEventListener("keydown", function(e){
  var t = e.target, typing = /^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName) || t.isContentEditable;

  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k"){ e.preventDefault(); cmdkOpen(); return; }

  if (el("cmdk").open){
    if (e.key === "ArrowDown"){ e.preventDefault(); cmdkMove(1); }
    else if (e.key === "ArrowUp"){ e.preventDefault(); cmdkMove(-1); }
    else if (e.key === "Enter"){ e.preventDefault(); cmdkGo(); }
    else setTimeout(function(){ cmdkI = 0; cmdkRender(); }, 0);
    return;
  }
  if (typing){
    if (e.key === "Escape"){ t.blur(); }
    return;
  }
  if (e.metaKey || e.ctrlKey || e.altKey) return;

  if (chord === "g" && performance.now() - chordAt < 1200){
    var map = { t:"today", p:"pipeline", l:"leads", f:"funnel", m:"marketing", s:"system" };
    chord = null;
    if (map[e.key]){ e.preventDefault(); kbNav = true; location.hash = href(map[e.key], "").slice(1); }
    return;
  }
  chord = null;

  switch (e.key){
    case "g": chord = "g"; chordAt = performance.now(); break;
    case "?": e.preventDefault(); drawKeys(); el("keys").showModal(); break;
    case "/": e.preventDefault();
      var f = el("lead-q"); if (f) f.focus(); else cmdkOpen(); break;
    case "j": e.preventDefault(); moveCursor(1); break;
    case "k": e.preventDefault(); moveCursor(-1); break;
    case "Enter": activateCursor(); break;
    case "Escape":
      if (!el("drawer").hidden) closeRec();
      else if (document.documentElement.dataset.rail === "open") document.documentElement.dataset.rail = "";
      break;
    case "[": toggleRail(); break;
    case "d":
      var dn = document.documentElement.dataset.density === "compact" ? "comfortable" : "compact";
      document.documentElement.dataset.density = dn; sset("density", dn); break;
  }
});

function toggleRail(){
  var r = document.documentElement.dataset.rail === "collapsed" ? "" : "collapsed";
  document.documentElement.dataset.rail = r; sset("rail", r);
}

/* ---------------------------------------------------------------- boot -- */
function boot(){
  var savedRail = sget("rail"); if (savedRail) document.documentElement.dataset.rail = savedRail;
  var savedD = sget("density"); if (savedD) document.documentElement.dataset.density = savedD;

  drawNav(); drawFreshness(); drawKeys(); wireOnce();

  on(el("rail-toggle"), "click", toggleRail);
  on(el("rail-open"), "click", function(){
    document.documentElement.dataset.rail = document.documentElement.dataset.rail === "open" ? "" : "open";
  });
  on(el("open-cmdk"), "click", cmdkOpen);
  on(el("open-cmdk-2"), "click", cmdkOpen);
  on(el("cmdk-list"), "click", function(e){
    var li = e.target.closest("[data-go]"); if (!li) return;
    el("cmdk").close(); location.hash = li.dataset.go.slice(1);
  });
  on(el("cmdk"), "click", function(e){ if (e.target === el("cmdk")) el("cmdk").close(); });
  on(el("keys"), "click", function(e){ if (e.target === el("keys")) el("keys").close(); });
  on(el("drawer-close"), "click", closeRec);
  on(el("scrim"), "click", closeRec);
  on(el("nav"), "click", function(){ if (innerWidth <= 820) document.documentElement.dataset.rail = ""; });
  /* The off-canvas dimmer is #main::before, so its taps arrive here. Capture,
     so the tap closes the rail instead of hitting whatever sits underneath. */
  el("main").addEventListener("click", function(e){
    if (document.documentElement.dataset.rail !== "open") return;
    e.preventDefault(); e.stopPropagation();
    document.documentElement.dataset.rail = "";
  }, true);

  window.addEventListener("hashchange", function(){ route = parseHash(); render(); });
  route = parseHash();
  paint();

  /* Stamp the visit AFTER the first paint so "new since last visit" compares
     against the previous session, not this one. */
  setTimeout(function(){ sset("lastVisit", new Date().toISOString()); }, 1200);
}

if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot);
else boot();

})();
</script>
